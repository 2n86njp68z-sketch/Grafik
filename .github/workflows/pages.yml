# Uygulamayı GitHub Pages'te yayınlar: https://<kullanıcı>.github.io/Grafik/
# Verileri Yahoo Finance'ten çekip hazır JSON dosyaları olarak üretir (scripts/build-static.mjs)
# ve gh-pages branch'ine yazar; GitHub Pages o branch'i yayınlar.
# Hafta içi gün boyunca saatte bir (ABD kapanışından sonra da), hafta sonu günde bir güncellenir.
name: Web sitesini güncelle

on:
  push:
  schedule:
    - cron: '17 6-22 * * 1-5'   # hafta içi 06:17–22:17 UTC (TR 09:17–01:17), saatte bir
    - cron: '17 12 * * 0,6'     # hafta sonu günde bir (kripto için)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Push'larda yalnızca varsayılan branch yayınlanır
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Zamanlanmış güncellemeyi canlı tut
        # GitHub, 60 gün yeni commit gelmeyen açık repolarda zamanlanmış iş akışlarını durdurur.
        # Son commit 40 günden eskiyse iş akışını "etkinleştir" çağrısı o sayacı sıfırlar; commit gerekmez.
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          age=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "Son commit $age gün önce"
          if [ "$age" -ge 40 ]; then
            curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/enable" \
              && echo "Zamanlayıcı yenilendi"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testler
        run: node --test
      - name: Verileri çek ve siteyi oluştur
        run: node scripts/build-static.mjs site
      - name: gh-pages branch'ine yaz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Önceki sürümü çek: değişmeyen dosyalar yeniden yüklenmez
          git fetch -q --depth=1 origin gh-pages || true
          # Bu turda Yahoo'dan alınamayan sembollerin önceki dosyalarını koru
          for f in $(jq -r '.failedFiles[]?' data/meta.json); do
            git checkout FETCH_HEAD -- "$f" 2>/dev/null && echo "korundu: $f" || true
          done
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Veri güncellemesi $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Tek commit'lik geçmiş: eski sürümler birikmesin
          git push -q -f origin gh-pages
          echo "Yayınlandı: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
