# Uygulamayı GitHub Pages'te yayınlar: https://<kullanıcı>.github.io/Grafik/
# Verileri Yahoo Finance'ten çekip hazır JSON dosyaları olarak siteye koyar
# (scripts/build-static.mjs). Hafta içi gün boyunca 2 saatte bir, hafta sonu günde bir güncellenir.
name: Web sitesini yayınla

on:
  push:
  schedule:
    - cron: '23 6-21/2 * * 1-5'   # hafta içi 06:23–20:23 UTC (TR 09:23–23:23), 2 saatte bir
    - cron: '23 12 * * 0,6'       # hafta sonu günde bir (kripto için)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Push'larda yalnızca varsayılan branch yayınlanır
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testler
        run: node --test
      - name: Verileri çek ve siteyi oluştur
        run: node scripts/build-static.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
