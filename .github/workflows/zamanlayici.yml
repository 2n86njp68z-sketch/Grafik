# Bakım: "Web sitesini güncelle" iş akışının zamanlayıcısını sıfırlar (kapatıp yeniden açar)
# ve hemen bir güncelleme başlatır. GitHub zamanlanmış çalışmaları başlatmazsa elle çalıştırılır.
name: Zamanlayıcıyı sıfırla

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      API: https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml
    steps:
      - name: Kapat ve yeniden aç
        run: |
          h=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          curl -fsS -X PUT "${h[@]}" "$API/disable" && echo "kapatıldı" || true
          sleep 15
          # Yeniden açma başarısız kalırsa site güncellenmez: durum "active" olana kadar dene
          # (API'nin gösterdiği durum birkaç saniye geriden gelebilir)
          for i in $(seq 1 12); do
            curl -fsS -X PUT "${h[@]}" "$API/enable" || true
            sleep 10
            state=$(curl -fsS "${h[@]}" "$API" | jq -r .state)
            echo "Durum: $state"
            [ "$state" = "active" ] && exit 0
          done
          exit 1
      - name: Hemen bir güncelleme başlat
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/dispatches" -d "{\"ref\":\"${{ github.event.repository.default_branch }}\"}" && echo "başlatıldı"
