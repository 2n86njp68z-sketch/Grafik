# GitHub'ın kendi zamanlayıcısı (schedule) bu repoda hiç tetiklenmedi; GitHub topluluğunda 2026
# boyunca aynı sorunu bildiren çok sayıda rapor var. Bu iş akışı bir sonraki saatin 17. dakikasına
# kadar bekler, "Web sitesini güncelle"yi başlatır ve kendini yeniden başlatarak döngüyü sürdürür.
# Döngü bir şekilde koparsa her site güncellemesi (pages.yml) ve aşağıdaki yedek zamanlama onu
# yeniden başlatır. Durdurmak için: Actions > bu iş akışı > "Disable workflow".
name: Saatlik güncelleme döngüsü

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */4 * * *'   # yedek: döngü koptuysa yeniden başlatır (GitHub çalıştırırsa)

permissions:
  actions: write

# Aynı anda tek döngü: yeni gelen tur, bekleyen eski turun yerini alır
concurrency:
  group: dongu
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      API: https://api.github.com/repos/${{ github.repository }}/actions/workflows
      REF: ${{ github.event.repository.default_branch }}
    steps:
      - name: Bir sonraki saatin 17. dakikasına kadar bekle
        run: |
          now=$(date -u +%s)
          wait=$(( (1020 - now % 3600 + 3600) % 3600 ))
          [ "$wait" -lt 120 ] && wait=$((wait + 3600))
          echo "$((wait / 60)) dakika bekleniyor"
          sleep "$wait"
      - name: Siteyi güncelle
        continue-on-error: true
        run: |
          h=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          if [ "$(date -u +%u)" -ge 6 ] && [ "$(date -u +%-H)" -ne 12 ]; then
            echo "Hafta sonu: yalnızca 12:17 UTC'de güncellenir"; exit 0
          fi
          # Son 45 dakikada başlamış bir güncelleme varsa (ör. GitHub'ın zamanlayıcısı çalıştıysa) tekrarlama
          since=$(date -u -d '-45 min' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(curl -fsS "${h[@]}" "$API/pages.yml/runs?per_page=10" | jq --arg s "$since" \
            '[.workflow_runs[] | select(.created_at >= $s and .conclusion != "cancelled" and .conclusion != "skipped")] | length') || recent=0
          if [ "${recent:-0}" -gt 0 ]; then echo "Son 45 dakikada güncellenmiş, atlanıyor"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            curl -fsS -X POST "${h[@]}" "$API/pages.yml/dispatches" -d "{\"ref\":\"$REF\"}" && { echo "Güncelleme başlatıldı"; exit 0; }
            sleep $((i * 20))
          done
          exit 1
      - name: Döngüyü sürdür
        # İptal edilirse sürdürmez (elle durdurulabilsin diye)
        if: success() || failure()
        run: |
          h=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsS -X POST "${h[@]}" "$API/dongu.yml/dispatches" -d "{\"ref\":\"$REF\"}" && { echo "Sonraki tur başlatıldı"; exit 0; }
            sleep $((i * 20))
          done
          exit 1
